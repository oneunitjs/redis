# ACL file for redis-acl. Defines an operator with full rights and a
# least-privilege "app" user that can only touch a safe keyspace.
#
# Users:
#   default (disabled via requirepass on admin-secret for the admin user)
#   app     — can read/write keys prefixed with "app:" only
#
default off
~default +@all -@dangerous
app >app-secret
app +@all
app -@dangerous
app +get +set +del +exists +expire +ttl +incr +ping +auth +hello +select
app ~app:*
allkeys
